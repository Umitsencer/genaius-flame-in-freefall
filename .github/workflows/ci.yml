name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check release layout
        run: python -B scripts/dev/check_release.py
      - name: Offline Python contracts
        env:
          PYTHONPATH: src:tests
        run: >-
          python -B -m unittest test_openrouter test_download_raw_data test_schemas
          test_data_query.SyntheticQueryContractTests
          test_document_retrieval.SyntheticBM25AndIsolationTests -v
      - name: Frontend checks
        run: |
          node frontend/tests/lib.test.js
          node frontend/tests/stats.test.js
          find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
